spring.application.name=cadence

# Database connection (uses environment variables - never hardcodes password)
spring.datasource.url=${CADENCE_DB_URL}
spring.datasource.username=${CADENCE_DB_USERNAME}
spring.datasource.password=${CADENCE_DB_PASSWORD}

# Show SQL in console (so you can see what Hibernate generates)
spring.jpa.show-sql=true

# Let Hibernate create/update tables automatically
spring.jpa.hibernate.ddl-auto=update